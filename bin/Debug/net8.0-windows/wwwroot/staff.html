<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("Images/AdminBackground.png");
            background-size: cover;
            margin: 0;
            position: relative;
            height: 100vh;
        }

        h1 {
            color: white;
            text-align: center;
            margin-top: 50px;
        }

        #user-display {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        button {
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 100px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        #btn-logout {
            position: absolute;
            top: -5px;
            left: 25px;
        }

        button:hover {
            background-color: #45a049;
        }

        .role-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            margin-top: 120px;
        }

        .role-box {
            width: 250px;
            border-radius: 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            background: #fff;
            transition: transform 0.2s;
            position: relative;
            overflow: visible;
        }

            .role-box:hover {
                transform: translateY(-5px);
            }

            .role-box img {
                width: 100%;
                height: 200px;
                object-fit: cover;
            }

        .role-title {
            background-color: #0057e7;
            color: white;
            font-weight: bold;
            padding: 12px 0;
            font-size: 20px;
        }

        .role-desc {
            background-color: #0057e7;
            color: white;
            font-size: 14px;
            padding: 8px 0;
        }

        .role-dropdown-bottom {
            max-height: 0;
            overflow: hidden;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            padding: 0;
            text-align: center;
            transition: max-height 0.5s ease-out, padding 0.5s ease-out;
            z-index: 999;
        }

        .role-box:hover .role-dropdown-bottom {
            max-height: 220px;
            padding: 15px;
        }

        .role-dropdown-bottom button {
            width: 90%;
            margin-top: 10px;
            padding: 12px;
            border-radius: 5px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            background-color: #ffc107;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

            .role-dropdown-bottom button:hover {
                background-color: #e0a800;
            }

        .role-dropdown-bottom input[type="checkbox"] {
            margin-right: 5px;
        }

        /* Queue Popup */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* LOGOUT CONFIRMATION POPUP STYLES */
        #custom-logout-popup {
            display: none; /* Default hidden */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .popup-box-confirm {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            width: 300px;
            text-align: center;
        }

        .custom-confirm-btn {
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
            width: 100px;
        }

        .ok-btn {
            background-color: #4CAF50;
            color: white;
        }

            .ok-btn:hover {
                background-color: #45a049;
                transform: translateY(-1px);
            }

        .cancel-btn {
            background-color: #f44336;
            color: white;
        }

            .cancel-btn:hover {
                background-color: #d32f2f;
                transform: translateY(-1px);
            }
        /* END LOGOUT CONFIRMATION POPUP STYLES */

        .popup-box {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            position: relative;
            width: 350px;
        }

        #queue-message {
            margin-top: 20px;
        }

        .queue-number {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            color: #FAB12F
        }

        .queue-details {
            font-size: 16px;
        }

        .close-top-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            border: none;
            background-color: #f44336;
            color: white;
            font-size: 20px;
            font-weight: bold;
            line-height: 35px;
            text-align: center;
            cursor: pointer;
            padding: 0;
        }

            .close-top-btn:hover {
                background-color: #d32f2f;
            }
    </style>
</head>
<body>
    <h1>Staff Dashboard</h1>
    <button id="btn-logout" onclick="confirmLogout()">Logout</button>

    <div id="user-display" style="
        position: absolute;
        top: 1px;
        right: 20px;
        font-weight: bold;
        font-size: 20px;
        color: white;
    "></div>

    <div class="role-container">
        <div class="role-box">
            <img src="images/checkup.png" alt="Check Up">
            <div class="role-title">Check-Up</div>
            <div class="role-desc">Available Check Up</div>
            <div class="role-dropdown-bottom">
                <input type="radio" name="checkup-type" id="prenatal" value="Prenatal"> Prenatal Check-Up
                <button onclick="generateCheckupQueue()">Generate</button>
            </div>
        </div>

        <div class="role-box">
            <img src="images/vaccine.png" alt="Vaccine">
            <div class="role-title">Vaccine</div>
            <div class="role-desc">Select Vaccine</div>
            <div class="role-dropdown-bottom" id="vaccine-dropdown">
                <input type="checkbox" id="vaccine-bcg" value="BCG"> BCG<br>
                <input type="checkbox" id="vaccine-hepa" value="HEPA B"> HEPA B<br>
                <input type="checkbox" id="vaccine-tetanus" value="TETANUS"> TETANUS
                <button onclick="generateVaccineQueue()">Generate</button>
            </div>
        </div>

        <div class="role-box">
            <img src="images/cashier.png" alt="Cashier">
            <div class="role-title">Cashier</div>
            <div class="role-desc">Payment & Billing</div>
            <div class="role-dropdown-bottom">
                <input type="radio" name="Payment & Billing" value="Cash Payment"> Cashier Payment
                <button onclick="generateCashierQueue()">Generate</button>
            </div>
        </div>
    </div>

    <div id="queue-popup" class="popup-overlay">
        <div class="popup-box">
            <button class="close-top-btn" onclick="closeQueuePopup()">×</button>
            <div id="queue-message"></div>
            <button onclick="printQueue()">Print</button>
        </div>
    </div>

    <div id="custom-logout-popup" class="popup-overlay">
        <div class="popup-box-confirm">
            <h3 style="color: #333; margin-top: 0;">Confirm Logout</h3>
            <p style="margin-bottom: 20px;">Are you sure you want to log out?</p>
            <div style="display: flex; justify-content: center; gap: 15px;">
                <button id="custom-ok-btn" class="custom-confirm-btn ok-btn" onclick="logoutConfirmed()">OK</button>
                <button id="custom-cancel-btn" class="custom-confirm-btn cancel-btn" onclick="cancelLogout()">Cancel</button>
            </div>
        </div>
    </div>
    <script>
        // Local counters for sequence generation
        let chkNumber = 0;
        let vcineNumber = 0;
        let csrNumber = 0;

        // Request last queue numbers from backend on page load
        if (window.chrome && window.chrome.webview) {
            // Listen for response from backend
            window.chrome.webview.addEventListener('message', event => {
                const message = event.data;
                if (typeof message === 'string' && message.startsWith('lastQueueNumbers:')) {
                    try {
                        const jsonStr = message.substring('lastQueueNumbers:'.length);
                        const lastNumbers = JSON.parse(jsonStr);
                        
                        // Initialize counters with last numbers from database
                        chkNumber = lastNumbers.CHK || 0;
                        vcineNumber = lastNumbers.VCINE || 0;
                        csrNumber = lastNumbers.CSR || 0;
                        
                        console.log('Initialized queue counters from database:', lastNumbers);
                    } catch (e) {
                        console.error('Failed to parse lastQueueNumbers:', e);
                    }
                }
            });

            // Request last queue numbers from backend
            window.chrome.webview.postMessage('getLastQueueNumbers');
        }

        // ---- LOGOUT FUNCTIONS ----
        function confirmLogout() {
            // Ipakita ang custom confirmation popup
            document.getElementById("custom-logout-popup").style.display = "flex";
        }

        function logoutConfirmed() {
            // Itago ang popup at ituloy ang logout (Tawagin ang original function)
            document.getElementById("custom-logout-popup").style.display = "none";
            logout(); // Ito ang orihinal na function na magpapadala ng message sa backend
        }

        function cancelLogout() {
            // Itago lang ang popup
            document.getElementById("custom-logout-popup").style.display = "none";
        }

        function logout() {
            // Ito ang function na nakikipag-usap sa C# Host
            window.chrome.webview.postMessage("logout");
        }
        // ---- END LOGOUT FUNCTIONS ----

        function closeQueuePopup() {
            document.getElementById("queue-popup").style.display = "none";
            document.querySelectorAll("input[type='radio']").forEach(r => r.checked = false);
            document.querySelectorAll("input[type='checkbox']").forEach(c => c.checked = false);
        }

        /**
         * Core function to generate queue number, send it to Admin, and show print popup.
         */
        function showQueuePopup(code, serviceText, serviceType) {
            let number;

            // Increment the local counter based on service type
            if (code === "CHK") {
                chkNumber = (chkNumber % 999) + 1;
                number = chkNumber;
            } else if (code === "VCINE") {
                vcineNumber = (vcineNumber % 999) + 1;
                number = vcineNumber;
            } else if (code === "CSR") {
                csrNumber = (csrNumber % 999) + 1;
                number = csrNumber;
            }

            const queueNumber = code + "-" + String(number).padStart(3, '0');
            const dateTime = new Date().toLocaleString();

            // === Shared Queue System via localStorage ===
            let queueList = JSON.parse(localStorage.getItem("queueList") || "[]");

            const queueData = {
                number: queueNumber,
                service: serviceText,
                serviceType: serviceType,
                staff: localStorage.getItem("loggedInUser") || "Staff",
                datetime: new Date().toLocaleString(),
            };


            // Convert queueData into a readable string for admin display
            const displayText = `${queueData.number} `;
            queueList.push(displayText);
            localStorage.setItem("queueList", JSON.stringify(queueList));
            localStorage.setItem("queueUpdated", Date.now().toString()); // 🔔 trigger admin update

            // Ipadala ang buong data bilang JSON string sa C# Host
            // NOTE: Kung ang Admin ay umaasa sa window.chrome.webview.postMessage,
            // kailangan itong i-enable at i-handle sa C# Host.
            window.chrome.webview.postMessage(`newQueue:${JSON.stringify(queueData)}`);
            console.log('heyyy');

            // I-display ang number para ma-print ng Staff
            const messageHTML = `
                            <span class="queue-number">${queueNumber}</span>
                            <span class="queue-details">
                                ${serviceText ? `Service: ${serviceText}<br>` : ""}
                                Date & Time: ${dateTime}<br>
                                Please take care of your queue number <br>
                                Thank You.
                            </span>
                        `;
            document.getElementById("queue-message").innerHTML = messageHTML;
            document.getElementById("queue-popup").style.display = "flex";
            if (document.activeElement) document.activeElement.blur();
        }

        /**
         * UPDATED FUNCTION: Direct print without dialog via C# backend
         */
        function printQueue() {
            const popupElement = document.getElementById("queue-message");
            const popupHTML = popupElement.innerHTML;

            console.log("=== PRINT QUEUE FUNCTION CALLED ===");
            console.log("Queue message HTML:", popupHTML);
            console.log("Timestamp:", new Date().toISOString());

            try {
                // Prepare complete HTML document for printing
                const printContent = `
                    <html>
                    <head>
                        <title>Queue Ticket</title>
                        <style>
                            @media print {
                                @page {
                                    size: auto;
                                    margin: 10mm;
                                }
                                body {
                                    margin: 0;
                                    padding: 10px;
                                    font-family: Arial, sans-serif;
                                    font-size: 14px;
                                    height: auto;
                                }
                            }
                            body {
                                margin: 0;
                                padding: 10px;
                                font-family: Arial, sans-serif;
                                font-size: 14px;
                                height: auto;
                            }
                            .queue-number {
                                font-size: 28px;
                                font-weight: bold;
                                display: block;
                                text-align: center;
                                margin: 10px 0;
                                color: #FAB12F;
                            }
                            .queue-details {
                                text-align: center;
                                font-size: 12px;
                                margin-bottom: 10px;
                                color: #333;
                            }
                        </style>
                    </head>
                    <body>
                        ${popupHTML}
                    </body>
                    </html>
                `;

                // Send print request to C# backend for silent printing
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(`printQueue:${printContent}`);
                    console.log("Print request sent to C# backend");
                } else {
                    console.error("WebView2 not available, falling back to dialog");
                    // Fallback: open print dialog if WebView2 is not available
                    const printWindow = window.open('', '', 'width=800,height=600');
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => {
                        printWindow.print();
                        setTimeout(() => printWindow.close(), 500);
                    }, 100);
                }
                
                console.log("Print process initiated successfully");
            } catch (error) {
                console.error("Error during print process:", error);
                console.error("Error details:", error.message);
                console.error("Error stack:", error.stack);
            }

            closeQueuePopup();
            console.log("Queue popup closed");
            console.log("=== PRINT QUEUE FUNCTION COMPLETED ===");
        }

        // Functions na tinatawag ng Generate buttons
        function generateCheckupQueue() {
            const selectedRadio = document.querySelector('input[name="checkup-type"]:checked');
            const serviceText = selectedRadio ? selectedRadio.value : null;

            if (serviceText) {
                showQueuePopup("CHK", serviceText, "Check-Up");
            } else {
                alert("Please select a Check-Up type.");
            }
        }

        function generateVaccineQueue() {
            const selectedCheckbox = [];
            document.querySelectorAll('#vaccine-dropdown input[type="checkbox"]:checked').forEach(cb => selectedCheckbox.push(cb.value));
            const serviceText = selectedCheckbox.length > 0 ? selectedCheckbox.join(", ") : null;

            if (serviceText) {
                showQueuePopup("VCINE", serviceText, "Vaccine");
            } else {
                alert("Please select at least one Vaccine.");
            }
        }

        function generateCashierQueue() {
            const selectedRadio = document.querySelector('input[name="Payment & Billing"]:checked');
            const serviceText = selectedRadio ? selectedRadio.value : null;

            if (serviceText) {
                showQueuePopup("CSR", serviceText, "Cashier");
            } else {
                alert("Please select a Cashier service.");
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const user = localStorage.getItem("loggedInUser");
            const role = localStorage.getItem("userRole");

            const display = document.getElementById("user-display");
            display.textContent = "";

            if (role === "staff" && user) {
                display.textContent = "Welcome, " + user;
            } else {
                console.log("Not logged in as Staff. (Simulated redirect)");
                display.textContent = "Error: Not Logged In";
            }
        });

    </script>
</body>
</html>
